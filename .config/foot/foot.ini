# -*- conf -*-
#
# Catppuccin Mocha theme for foot
# Theme source: https://github.com/catppuccin/foot
#   (themes/catppuccin-mocha.ini, MIT licensed)
#
# Structure follows the foot 1.16.2 reference config at
# /etc/xdg/foot/foot.ini and foot.ini(5). The upstream theme file uses a
# [colors-dark] section header; this version renames it to [colors] and moves
# cursor colors to the [cursor] section to match what foot 1.16.2 expects.
#
# Validate with: foot --check-config --config ~/.config/foot/foot.ini

font=JetBrainsMono Nerd Font:size=11
pad=4x4 center
initial-window-size-chars=100x25

[colors]
foreground=cdd6f4
background=1e1e2e

## Normal/regular colors (color palette 0-7)
regular0=45475a  # black   (surface1)
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # magenta (pink)
regular6=94e2d5  # cyan    (teal)
regular7=bac2de  # white   (subtext1)

## Bright colors (color palette 8-15)
bright0=585b70   # bright black   (surface2)
bright1=f38ba8   # bright red
bright2=a6e3a1   # bright green
bright3=f9e2af   # bright yellow
bright4=89b4fa   # bright blue
bright5=f5c2e7   # bright magenta (pink)
bright6=94e2d5   # bright cyan    (teal)
bright7=a6adc8   # bright white   (subtext0)

## Extended 256-color palette overrides
16=fab387        # peach
17=f5e0dc        # rosewater

## Misc colors
selection-foreground=cdd6f4
selection-background=414356
jump-labels=11111b fab387       # crust-on-peach
search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244
urls=89b4fa

[cursor]
# text color + cursor color (rosewater), from upstream theme's "cursor" key
color=11111b f5e0dc

[csd]
# Gala/Pantheon doesn't support the xdg-decoration protocol, so foot always
# falls back to client-side decorations. These style the CSDs to match the
# elementary OS dark-mode headerbar instead.
#
# Color reference: GTK stylesheet for the user's current accent/dark mode:
#   /usr/share/themes/io.elementary.stylesheet.bubblegum/gtk-4.0/gtk-dark.css
#   (headerbar: background=@color_primary #2a2a2a, color=white,
#    .title { font-weight: bold }; error_color=#ed5353)
# Re-run this to re-check values if the accent theme or dark mode changes:
#   grep -E "define-color (color_primary|error_color)" "/usr/share/themes/$(gsettings get org.gnome.desktop.interface gtk-theme | tr -d \')/gtk-4.0/gtk-dark.css"
#
# foot quirks (verified in foot 1.16.2 render.c):
#   - [csd] "color" is the titlebar BACKGROUND; "button-color" is used as
#     BOTH the title text color and the button glyph color.
#   - Titles are always left-aligned; centering is not supported by foot.
#   - Buttons are statically colored (elementary shows them on hover only).
# Colors are AARRGGBB (alpha-prefixed) per foot.ini(5).
size=30                     # ~Pantheon headerbar height (foot default is 26)
color=ff2a2a2a              # elementary dark headerbar bg (@color_primary)
font=Inter:weight=bold      # bold title, elementary's UI font (fontconfig format)
button-color=ffffffff       # white title text + button glyphs
border-width=0
border-color=ff2a2a2a       # seamless with titlebar
hide-when-maximized=no      # faithful to elementary: headerbar persists when maximized
button-minimize-color=ff4d4d4d   # subtle neutral circles (closest static match)
button-maximize-color=ff4d4d4d
button-close-color=ffed5353      # elementary error_color
